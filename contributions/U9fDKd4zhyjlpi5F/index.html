<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contribution — La Voie lactée</title>
<style>
  .vlx *{margin:0;padding:0;box-sizing:border-box}
  .vlx{all:initial;display:block;position:relative;height:420px;overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;color:#f3eefc;
    background:radial-gradient(ellipse at 50% 52%,#1d1036,#030208)}
  .vlx canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
  .vlx .t{position:absolute;top:14px;left:16px;right:16px;text-shadow:0 1px 8px #000;pointer-events:none}
  .vlx .t b{display:block;font:italic 700 1.35rem Georgia,serif;color:#f5c26b}
  .vlx .t span{font-size:.76rem}
  .vlx .n{display:none;position:absolute;left:14px;right:14px;bottom:14px;max-width:392px;margin:0 auto;
    padding:10px 12px;border-radius:12px;background:#f4f0ff;color:#1a1033;font-size:.8rem;line-height:1.35}
  .vlx .n b{display:block;font-size:.95rem}
</style>
</head>
<body>
<div class="vlx">
  <canvas role="img" aria-label="La Voie lactée, galaxie spirale barrée"></canvas>
  <div class="t"><b>La Voie lactée</b><span>Glisse pour tourner et incliner, touche un point.</span></div>
  <div class="n"></div>
</div>
 
<script>
document.querySelectorAll(".vlx:not([data-r])").forEach(function (root) {
  root.dataset.r = 1;
  var cv = root.querySelector("canvas"), ctx = cv.getContext("2d"), box = root.querySelector(".n");
  var B = 2.75, S = 0.28, A = [0, 1.57, 3.14, 4.71], seed = 7;
 
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function gauss() { return Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(6.283 * rnd()); }
  function arm(k, r) { return A[k] + B * Math.log(r / S); }
  function pos(k, r) { var t = arm(k, r); return [r * Math.cos(t), r * Math.sin(t)]; }
 
  // Étoiles : [x, y, z, couleur]
  var P = [], i;
  for (i = 0; i < 1500; i++) P.push([gauss() * 0.1, gauss() * 0.1, gauss() * 0.07, "rgba(255,210,150,.7)"]);
  for (i = 0; i < 700; i++) P.push([(rnd() * 2 - 1) * 0.3, gauss() * 0.03, gauss() * 0.03, "rgba(255,235,200,.8)"]);
  for (i = 0; i < 5500; i++) {
    var k = rnd() < 0.64 ? (rnd() < 0.5 ? 0 : 2) : (rnd() < 0.5 ? 1 : 3);
    var r = S + (1 - S) * Math.pow(rnd(), 1.2), t = arm(k, r) + gauss() * (0.2 + 0.12 * r);
    P.push([r * Math.cos(t), r * Math.sin(t), gauss() * 0.015,
      rnd() < 0.15 ? "rgba(255,150,190,.8)" : "rgba(175,205,255,.7)"]);
  }
  P.sort(function (a, b) { return a[3] < b[3] ? -1 : 1; });
 
  // Repères : [nom, x, y, texte, couleur]
  var sun = pos(1, 0.52), per = pos(0, 0.78);
  var M = [
    ["Le Soleil", sun[0], sun[1], "À environ 26 000 années-lumière du centre, dans un bras secondaire. Il fait le tour de la galaxie en 230 millions d’années.", "#ffe27a"],
    ["Sagittarius A*", 0, 0, "Trou noir supermassif d’environ 4 millions de masses solaires, photographié en 2022.", "#ff8fb8"],
    ["La barre centrale", 0.23, 0.02, "Une barre d’étoiles d’environ 27 000 années-lumière de long traverse le centre. Les grands bras en partent.", "#ffd9a0"],
    ["Bras de Persée", per[0], per[1], "L’un des deux grands bras de la galaxie, plus loin du centre que nous.", "#8fe3ff"]
  ];
 
  var W, H, R, sp = 0.4, ti = 1, drag, mv, lx, ly, sc = [];
 
  function size() {
    var b = root.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    W = b.width; H = b.height; cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0); R = Math.min(W, H) * 0.4;
  }
  size();
  addEventListener("resize", size);
 
  function draw() {
    if (!drag) sp += 0.001;
    var c = Math.cos(sp), s = Math.sin(sp), ct = Math.cos(ti), st = Math.sin(ti), cur;
    ctx.clearRect(0, 0, W, H);
 
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1, Math.max(ct, 0.5));
    var g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.4);
    g.addColorStop(0, "rgba(255,200,120,.6)"); g.addColorStop(1, "rgba(255,150,90,0)");
    ctx.fillStyle = g; ctx.fillRect(-R, -R, 2 * R, 2 * R); ctx.restore();
 
    ctx.globalCompositeOperation = "lighter";
    P.forEach(function (p) {
      if (p[3] !== cur) ctx.fillStyle = cur = p[3];
      ctx.fillRect(W / 2 + (p[0] * c - p[1] * s) * R, H / 2 + ((p[0] * s + p[1] * c) * ct - p[2] * st) * R, 1.2, 1.2);
    });
    ctx.globalCompositeOperation = "source-over";
 
    ctx.font = "600 12px Segoe UI, sans-serif";
    M.forEach(function (m, n) {
      var x = W / 2 + (m[1] * c - m[2] * s) * R, y = H / 2 + (m[1] * s + m[2] * c) * ct * R;
      sc[n] = [x, y];
      ctx.strokeStyle = m[4]; ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.3); ctx.stroke();
      if (!n) { ctx.fillStyle = "#fff"; ctx.fillText("Tu es ici", x + 12, y - 10); }
    });
    requestAnimationFrame(draw);
  }
  draw();
 
  cv.onpointerdown = function (e) { drag = 1; mv = 0; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); };
  cv.onpointercancel = function () { drag = 0; };
  cv.onpointermove = function (e) {
    if (!drag) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY; mv += Math.abs(dx) + Math.abs(dy); sp += dx * 0.008;
    if (e.pointerType != "touch") ti = Math.max(0, Math.min(1.52, ti + dy * 0.006));
  };
  cv.onpointerup = function (e) {
    drag = 0;
    if (mv > 4) return;
    var b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top, k = -1;
    sc.forEach(function (q, n) { if (Math.hypot(q[0] - x, q[1] - y) < 18) k = n; });
    box.style.display = k < 0 ? "none" : "block";
    if (k >= 0) box.innerHTML = "<b>" + M[k][0] + "</b>" + M[k][3];
  };
});
</script>
</body>
</html>
